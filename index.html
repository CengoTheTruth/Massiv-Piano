<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano & Kater</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #17131f;
  color: white;
  text-align: center;
}

header {
  padding: 22px 10px;
}

h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  color: #c8bfd4;
  margin-top: 8px;
}

.cat {
  font-size: 80px;
  margin: 10px;
}

.message {
  margin: 15px auto;
  padding: 14px;
  max-width: 500px;
  background: #282132;
  border-radius: 16px;
  min-height: 25px;
}

.piano {
  display: flex;
  justify-content: center;
  margin: 25px auto;
  max-width: 600px;
  height: 190px;
}

.key {
  width: 45px;
  height: 180px;
  background: white;
  color: black;
  border: 1px solid #222;
  border-radius: 0 0 7px 7px;
  cursor: pointer;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 12px;
  font-weight: bold;
}

.key:active {
  background: #d8d8d8;
  transform: translateY(3px);
}

.controls {
  margin: 20px;
}

button {
  border: none;
  border-radius: 14px;
  padding: 13px 18px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
  background: #8e68c7;
  color: white;
}

button:active {
  transform: scale(.97);
}

.recording {
  background: #b53b5c;
}

.log {
  max-width: 600px;
  margin: 20px auto;
  text-align: left;
  padding: 0 15px 30px;
}

.note {
  padding: 10px;
  border-bottom: 1px solid #3b3247;
}
</style>
</head>

<body>

<header>
  <h1>🎹 Piano & 🐱 Kater</h1>
  <div class="subtitle">Musik zwischen Mensch und KI-Kater</div>
</header>

<div class="cat">🐱</div>

<div class="message" id="message">
  Miau! Spiel mir eine Melodie. 🎵
</div>

<div class="piano">

  <button class="key" data-note="261.63">C</button>
  <button class="key" data-note="293.66">D</button>
  <button class="key" data-note="329.63">E</button>
  <button class="key" data-note="349.23">F</button>
  <button class="key" data-note="392.00">G</button>
  <button class="key" data-note="440.00">A</button>
  <button class="key" data-note="493.88">H</button>
  <button class="key" data-note="523.25">C</button>

</div>

<div class="controls">

  <button id="playCat">
    🐱 Kater antwortet
  </button>

  <button id="record">
    🎙️ Aufnahme starten
  </button>

  <button id="stop" disabled>
    ⏹️ Aufnahme stoppen
  </button>

</div>

<div class="log" id="log">
  <div class="note">🐱 Kater: „Ich höre dir zu...“</div>
</div>

<script>

let audioContext;
let melody = [];

function playNote(frequency, duration = 0.45) {

  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.frequency.value = frequency;
  oscillator.type = "sine";

  gain.gain.setValueAtTime(0.001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.35,
    audioContext.currentTime + 0.02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + duration);
}

document.querySelectorAll(".key").forEach(key => {

  key.addEventListener("click", () => {

    const frequency = Number(key.dataset.note);

    playNote(frequency);

    melody.push(frequency);

    document.getElementById("message").textContent =
      "🐱 Miau! Ich habe deine Note gehört!";

  });

});

document.getElementById("playCat").addEventListener("click", () => {

  const response = [
    392.00,
    440.00,
    523.25,
    440.00,
    392.00,
    329.63
  ];

  document.getElementById("message").textContent =
    "🐱 Dein Kater antwortet musikalisch...";

  response.forEach((note, index) => {

    setTimeout(() => {
      playNote(note, 0.5);
    }, index * 500);

  });

  const log = document.getElementById("log");

  const item = document.createElement("div");

  item.className = "note";
  item.textContent =
    "🐱 Kater: „Miau... das ist meine Antwort auf deine Melodie.“";

  log.appendChild(item);

});

let recorder;
let audioChunks = [];

document.getElementById("record").addEventListener("click", async () => {

  try {

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    recorder = new MediaRecorder(stream);
    audioChunks = [];

    recorder.ondataavailable = event => {
      audioChunks.push(event.data);
    };

    recorder.onstop = () => {

      const blob = new Blob(audioChunks, {
        type: "audio/webm"
      });

      const url = URL.createObjectURL(blob);

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = url;

      const log = document.getElementById("log");

      const item = document.createElement("div");
      item.className = "note";

      item.innerHTML = "🎙️ Deine Sprachaufnahme:<br>";
      item.appendChild(audio);

      log.appendChild(item);

      stream.getTracks().forEach(track => track.stop());

    };

    recorder.start();

    document.getElementById("record").disabled = true;
    document.getElementById("stop").disabled = false;

    document.getElementById("message").textContent =
      "🎙️ Ich höre zu...";

  } catch (error) {

    document.getElementById("message").textContent =
      "⚠️ Mikrofon konnte nicht gestartet werden.";

  }

});

document.getElementById("stop").addEventListener("click", () => {

  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }

  document.getElementById("record").disabled = false;
  document.getElementById("stop").disabled = true;

  document.getElementById("message").textContent =
    "🐱 Dein Kater hat deine Aufnahme bekommen!";

});

</script>

</body>
</html>
